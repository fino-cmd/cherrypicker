  <path d="M42 8 Q50 3 48 12 Q44 10 42 8Z" fill="#5aad4e" stroke="#3a3a3a" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- cherry body shadow -->
  <circle cx="24" cy="42" r="18" fill="#8b0000" opacity="0.3"/>
  <!-- cherry body -->
  <circle cx="24" cy="40" r="18" fill="#c01020" stroke="#3a3a3a" stroke-width="3"/>
  <!-- highlight -->
  <ellipse cx="18" cy="33" rx="5" ry="3.5" fill="white" opacity="0.35" transform="rotate(-20,18,33)"/>
</svg>
